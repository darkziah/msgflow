name = "msgflow-worker"
account_id = "2b264b86e8b917f95fc97400900af720"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The production Worker serves the Vite build at its custom domain. Keep the
# public app generic: the hostname is attached at deploy time, not committed.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/webhooks/*", "/ws"]

[observability]
enabled = true

# Non-secret production runtime configuration. Secrets are uploaded separately
# with `wrangler secret put` and never belong in this file.
[vars]
ATTACHMENT_PUBLIC_BASE_URL = "https://attachments.msgflow.yeheyremit.jp"
BETTER_AUTH_URL = "https://msgflow.yeheyremit.jp"
BETTER_AUTH_TRUSTED_ORIGINS = "https://msgflow.yeheyremit.jp"

[[d1_databases]]
binding = "DB"
database_name = "msgflow"
# Production D1 database, created in the Yehey Japan Cloudflare account (APAC).
database_id = "867d5b8c-d960-4782-98d5-be9a85d10edc"

[[durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDO"]

[[send_email]]
name = "EMAIL"

# Production R2 image bucket. Its public custom domain is a non-secret Worker
# runtime variable, not a hard-coded application setting.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "msgflow-attachments"

# Private email raw-MIME/attachment archive (ADR 0021). This must never have a
# public custom domain or share the Messenger attachment bucket.
[[r2_buckets]]
binding = "EMAIL_ARCHIVE"
bucket_name = "msgflow-email-archive"

# Send-later: every minute, delivers due scheduled_messages rows (ADR 0013).
[triggers]
crons = ["* * * * *"]

# Inbound email routing (Cloudflare Email Service → email() handler) is enabled
# per-domain in the dashboard: Email Service > Email Routing > route to this Worker.

# Auth: BETTER_AUTH_SECRET is set via `wrangler secret put` (or .dev.vars locally);
# BETTER_AUTH_URL is the Worker's public base URL. See apps/worker/.dev.vars.example.
# Set ATTACHMENT_PUBLIC_BASE_URL as a non-secret Worker runtime variable at
# deploy time. It must be the public custom domain serving ATTACHMENTS and must
# not end with '/'.
